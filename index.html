<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #1a1a2e;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 400px;
  color: #eee;
}

h1 {
  font-size: 28px;
  color: #00ff88;
  letter-spacing: 2px;
}

.score-board {
  display: flex;
  gap: 24px;
  font-size: 16px;
}

.score-board span {
  color: #00ff88;
  font-weight: bold;
  font-size: 20px;
}

canvas {
  border: 2px solid #333;
  border-radius: 4px;
  background: #16213e;
}

.controls {
  display: flex;
  gap: 12px;
}

button {
  padding: 10px 28px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-start {
  background: #00ff88;
  color: #1a1a2e;
}
.btn-start:hover {
  background: #00cc6a;
}

.btn-pause {
  background: #ffaa00;
  color: #1a1a2e;
}
.btn-pause:hover {
  background: #e69900;
}

.instructions {
  color: #888;
  font-size: 13px;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <h1>贪吃蛇</h1>
    <div class="score-board">
      <div>得分: <span id="score">0</span></div>
      <div>最高: <span id="highScore">0</span></div>
    </div>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn-start" id="btnStart">开始游戏</button>
    <button class="btn-pause" id="btnPause">暂停</button>
  </div>

  <p class="instructions">方向键 / WASD 控制方向 &nbsp;|&nbsp; 空格键 开始/暂停</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake = [{x: 10, y: 10}];
let direction = {x: 0, y: 0};
let nextDirection = {x: 0, y: 0};
let food = {};
let score = 0;
let highScore = localStorage.getItem('snakeHighScore') || 0;
let gameLoop = null;
let running = false;
let paused = false;
let speed = 100;

highScoreEl.textContent = highScore;

function randomFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= canvas.width; x += GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#ff4757';
  ctx.shadowColor = '#ff4757';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(
    food.x * GRID + GRID / 2,
    food.y * GRID + GRID / 2,
    GRID / 2 - 1,
    0,
    Math.PI * 2
  );
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const ratio = 1 - i / (snake.length + 8);
    const r = Math.floor(0 + ratio * 0);
    const g = Math.floor(255 - ratio * 100);
    const b = Math.floor(136 - ratio * 60);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.beginPath();
    ctx.roundRect(
      seg.x * GRID + 1,
      seg.y * GRID + 1,
      GRID - 2,
      GRID - 2,
      4
    );
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Paused overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '24px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'start';
  }
}

function update() {
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      localStorage.setItem('snakeHighScore', highScore);
    }
    food = randomFood();
    // Speed up
    if (speed > 50) {
      speed -= 1;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function tick() {
  direction = {...nextDirection};
  if (direction.x === 0 && direction.y === 0) return;
  update();
}

function gameOver() {
  running = false;
  clearInterval(gameLoop);
  gameLoop = null;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff4757';
  ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 12);
  ctx.fillStyle = '#ccc';
  ctx.font = '16px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('点击"开始游戏"重新开始', canvas.width / 2, canvas.height / 2 + 22);
  ctx.textAlign = 'start';

  btnStart.textContent = '重新开始';
}

function startGame() {
  snake = [{x: 10, y: 10}];
  direction = {x: 0, y: 0};
  nextDirection = {x: 0, y: 0};
  score = 0;
  speed = 100;
  running = true;
  paused = false;
  scoreEl.textContent = '0';
  btnStart.textContent = '开始游戏';
  food = randomFood();

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
  draw();
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  btnPause.textContent = paused ? '继续' : '暂停';
  if (paused) {
    clearInterval(gameLoop);
    gameLoop = null;
  } else {
    gameLoop = setInterval(tick, speed);
  }
  draw();
}

function changeDirection(dx, dy) {
  if (!running || paused) return;
  // Prevent reversing
  if (dx === -direction.x && dy === -direction.y) return;
  nextDirection = {x: dx, y: dy};
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': e.preventDefault(); changeDirection(0, -1); break;
    case 'ArrowDown':  case 's': case 'S': e.preventDefault(); changeDirection(0, 1);  break;
    case 'ArrowLeft':  case 'a': case 'A': e.preventDefault(); changeDirection(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); changeDirection(1, 0);  break;
    case ' ': e.preventDefault();
      if (!running) startGame();
      else togglePause();
      break;
  }
});

btnStart.addEventListener('click', startGame);
btnPause.addEventListener('click', togglePause);

// Initial draw
food = randomFood();
draw();
</script>
</body>
</html>
