<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#game-container {
  position: relative;
  border: 3px solid #444;
  border-radius: 4px;
  box-shadow: 0 0 30px rgba(0,150,0,0.3);
}
canvas { display: block; }
#ui {
  position: absolute;
  top: 10px;
  left: 15px;
  color: #0f0;
  font-size: 16px;
  pointer-events: none;
  text-shadow: 0 0 8px rgba(0,255,0,0.6);
}
#ui span { margin-right: 24px; }
#game-over {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #f44;
  font-size: 36px;
  font-weight: bold;
  text-align: center;
  pointer-events: none;
  display: none;
  text-shadow: 0 0 20px rgba(255,0,0,0.8);
}
#game-over button {
  display: block;
  margin: 16px auto 0;
  padding: 10px 24px;
  font-size: 18px;
  font-family: inherit;
  background: #0a0;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  pointer-events: auto;
}
#game-over button:hover { background: #0c0; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <span>🏆 <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>👾 <span id="enemies-left">0</span></span>
    <span>🎯 第<span id="stage">1</span>关</span>
  </div>
  <div id="game-over">
    <div id="go-text"></div>
    <button id="restart-btn">重新开始</button>
  </div>
</div>

<script>
// ========== CONSTANTS ==========
const COLS = 26;
const ROWS = 26;
const CELL = 24;
const W = COLS * CELL;
const H = ROWS * CELL;

const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

// Colors
const C_BG      = '#1a1a1a';
const C_WALL    = '#8B4513';
const C_STEEL   = '#888';
const C_PLAYER  = '#ff0';
const C_PLAYER2 = '#fa0';
const C_ENEMY   = '#f44';
const C_ENEMY2  = '#c00';
const C_BULLET  = '#fff';

const TILE = { EMPTY: 0, BRICK: 1, STEEL: 2, BASE: 3 };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

// ========== GAME STATE ==========
let map, player, enemies, bullets, particles;
let score, lives, stage, enemiesLeft;
let keys = {};
let gameRunning = false;
let gameOverFlag = false;
let spawnTimer = 0;
let enemyShootTimer = 0;
let frameCount = 0;

// ========== MAP ==========
const stages = [];

function buildStage1() {
  const m = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  // Outer walls
  for (let x = 0; x < COLS; x++) { m[0][x] = 2; m[ROWS-1][x] = 2; }
  for (let y = 0; y < ROWS; y++) { m[y][0] = 2; m[y][COLS-1] = 2; }
  // Brick clusters
  for (let y = 3; y <= 6; y++) for (let x = 4; x <= 7; x++) m[y][x] = 1;
  for (let y = 3; y <= 6; y++) for (let x = 18; x <= 21; x++) m[y][x] = 1;
  for (let y = 19; y <= 22; y++) for (let x = 4; x <= 7; x++) m[y][x] = 1;
  for (let y = 19; y <= 22; y++) for (let x = 18; x <= 21; x++) m[y][x] = 1;
  // Center steel
  for (let y = 12; y <= 13; y++) for (let x = 11; x <= 14; x++) m[y][x] = 2;
  // Middle bricks
  for (let x = 0; x <= 3; x++) m[12][x] = 1;
  for (let x = COLS-4; x < COLS; x++) m[12][x] = 1;
  for (let x = 0; x <= 3; x++) m[13][x] = 1;
  for (let x = COLS-4; x < COLS; x++) m[13][x] = 1;
  // Horizontal lines
  for (let x = 8; x <= 17; x++) { m[7][x] = 1; m[18][x] = 1; }
  // Vertical lines
  for (let y = 9; y <= 16; y++) { m[y][7] = 1; m[y][18] = 1; }
  // Base protection
  m[ROWS-2][12] = 1; m[ROWS-2][13] = 1;
  m[ROWS-3][12] = 1; m[ROWS-3][13] = 1;
  return m;
}

stages.push(buildStage1());

// ========== ENTITIES ==========
class Tank {
  constructor(x, y, dir, color, color2, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.color2 = color2;
    this.isPlayer = isPlayer;
    this.speed = isPlayer ? 0.12 : 0.04;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 15 : 60;
    this.alive = true;
    this.size = CELL * 0.85;
    this.half = this.size / 2;
    // Smooth position (in pixels)
    this.px = x * CELL + CELL / 2;
    this.py = y * CELL + CELL / 2;
    this.moving = false;
    // AI state
    this.aiDirTimer = 0;
    this.aiShootTimer = 30 + Math.floor(Math.random() * 80);
  }

  gridX() { return Math.round((this.px - CELL/2) / CELL); }
  gridY() { return Math.round((this.py - CELL/2) / CELL); }

  collides(px, py) {
    const h = this.half - 2;
    const gx1 = Math.floor((px - h) / CELL);
    const gy1 = Math.floor((py - h) / CELL);
    const gx2 = Math.floor((px + h - 1) / CELL);
    const gy2 = Math.floor((py + h - 1) / CELL);
    for (let gy = gy1; gy <= gy2; gy++) {
      for (let gx = gx1; gx <= gx2; gx++) {
        if (gy < 0 || gy >= ROWS || gx < 0 || gx >= COLS) return true;
        if (map[gy][gx] !== 0) return true;
      }
    }
    // Check collision with other tanks
    const allTanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this && e.alive)];
    if (!this.isPlayer) allTanks.unshift(player);
    for (const t of allTanks) {
      if (!t || !t.alive || t === this) continue;
      const dx = px - t.px;
      const dy = py - t.py;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < this.half + t.half - 2) return true;
    }
    return false;
  }

  update() {
    if (!this.alive) return;
    if (this.shootCooldown > 0) this.shootCooldown--;

    if (this.isPlayer) {
      let newDir = -1;
      if (keys['w'] || keys['arrowup'])    newDir = DIR.UP;
      else if (keys['s'] || keys['arrowdown']) newDir = DIR.DOWN;
      else if (keys['a'] || keys['arrowleft']) newDir = DIR.LEFT;
      else if (keys['d'] || keys['arrowright']) newDir = DIR.RIGHT;

      if (newDir >= 0) {
        this.dir = newDir;
        const nx = this.px + DX[this.dir] * this.speed * CELL;
        const ny = this.py + DY[this.dir] * this.speed * CELL;
        if (!this.collides(nx, ny)) {
          this.px = nx;
          this.py = ny;
        }
      }
      if (keys[' '] || keys['j']) this.shoot();
    } else {
      // Enemy AI
      this.aiDirTimer--;
      if (this.aiDirTimer <= 0) {
        this.aiDirTimer = 40 + Math.floor(Math.random() * 60);
        // Bias toward player direction sometimes
        if (Math.random() < 0.4) {
          const dx = player.px - this.px;
          const dy = player.py - this.py;
          if (Math.abs(dx) > Math.abs(dy)) {
            this.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
          } else {
            this.dir = dy > 0 ? DIR.DOWN : DIR.UP;
          }
        } else {
          this.dir = Math.floor(Math.random() * 4);
        }
      }
      const nx = this.px + DX[this.dir] * this.speed * CELL;
      const ny = this.py + DY[this.dir] * this.speed * CELL;
      if (!this.collides(nx, ny)) {
        this.px = nx;
        this.py = ny;
      } else {
        this.aiDirTimer = 0; // Force direction change
      }

      this.aiShootTimer--;
      if (this.aiShootTimer <= 0) {
        this.shoot();
        this.aiShootTimer = 40 + Math.floor(Math.random() * 80);
      }
    }
  }

  shoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.shootDelay;
    const bx = this.px + DX[this.dir] * this.half;
    const by = this.py + DY[this.dir] * this.half;
    bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
  }

  draw() {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.px, this.py);
    ctx.rotate(this.dir * Math.PI / 2);
    // Tracks
    ctx.fillStyle = '#222';
    ctx.fillRect(-this.half, -this.half, this.size * 0.28, this.size);
    ctx.fillRect(this.half - this.size * 0.28, -this.half, this.size * 0.28, this.size);
    // Body
    ctx.fillStyle = this.color;
    const inset = this.size * 0.18;
    ctx.fillRect(-this.half + inset, -this.half + 2, this.size - inset*2, this.size - 4);
    // Turret highlight
    ctx.fillStyle = this.color2;
    ctx.fillRect(-4, -this.half + 2, 8, this.size * 0.4);
    // Barrel
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-3, -this.half - 2, 6, this.size * 0.38);
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, dir, isPlayer) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.speed = 0.3;
    this.alive = true;
    this.r = 2.5;
  }

  update() {
    this.x += DX[this.dir] * this.speed * CELL;
    this.y += DY[this.dir] * this.speed * CELL;

    // Out of bounds
    if (this.x < 0 || this.x >= W || this.y < 0 || this.y >= H) {
      this.alive = false;
      return;
    }

    // Hit wall
    const gx = Math.floor(this.x / CELL);
    const gy = Math.floor(this.y / CELL);
    if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS) {
      const tile = map[gy][gx];
      if (tile === TILE.BRICK) {
        map[gy][gx] = TILE.EMPTY;
        spawnParticles(gx * CELL + CELL/2, gy * CELL + CELL/2, C_WALL);
        this.alive = false;
        return;
      }
      if (tile === TILE.STEEL) {
        spawnParticles(this.x, this.y, C_STEEL);
        this.alive = false;
        return;
      }
    }

    // Hit tanks
    if (this.isPlayer) {
      for (const e of enemies) {
        if (!e.alive) continue;
        const dx = this.x - e.px;
        const dy = this.y - e.py;
        if (Math.sqrt(dx*dx + dy*dy) < e.half) {
          e.alive = false;
          this.alive = false;
          spawnParticles(e.px, e.py, C_ENEMY);
          score += 100;
          enemiesLeft--;
          return;
        }
      }
    } else {
      const dx = this.x - player.px;
      const dy = this.y - player.py;
      if (Math.sqrt(dx*dx + dy*dy) < player.half) {
        player.alive = false;
        this.alive = false;
        spawnParticles(player.px, player.py, C_PLAYER);
        lives--;
        if (lives <= 0) endGame(false);
        else respawnPlayer();
        return;
      }
    }

    // Bullet vs bullet
    for (const b of bullets) {
      if (b === this || !b.alive) continue;
      if (b.isPlayer === this.isPlayer) continue;
      const dx = this.x - b.x;
      const dy = this.y - b.y;
      if (Math.sqrt(dx*dx + dy*dy) < this.r + b.r) {
        this.alive = false;
        b.alive = false;
        spawnParticles(this.x, this.y, '#fff');
        return;
      }
    }
  }

  draw() {
    if (!this.alive) return;
    ctx.fillStyle = C_BULLET;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ========== PARTICLES ==========
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.life = 15 + Math.random() * 10;
  }
  update() { this.x += this.vx; this.y += this.vy; this.life--; }
  draw() {
    const alpha = this.life / 25;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(this.x - 1, this.y - 1, 3, 3);
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// ========== GAME FLOW ==========
function initStage() {
  map = stages[(stage - 1) % stages.length].map(r => [...r]);
  player = new Tank(9, ROWS - 3, DIR.UP, C_PLAYER, C_PLAYER2, true);
  enemies = [];
  bullets = [];
  particles = [];
  enemiesLeft = 4 + stage * 2;
  spawnTimer = 0;
  enemyShootTimer = 0;
  gameOverFlag = false;
  document.getElementById('game-over').style.display = 'none';
}

function respawnPlayer() {
  player = new Tank(9, ROWS - 3, DIR.UP, C_PLAYER, C_PLAYER2, true);
  // Brief invulnerability
  bullets = bullets.filter(b => b.isPlayer);
}

function spawnEnemy() {
  if (enemiesLeft <= 0) return;
  // Spawn at top (random x)
  const sx = 2 + Math.floor(Math.random() * (COLS - 4));
  const sy = 1;
  const e = new Tank(sx, sy, DIR.DOWN, C_ENEMY, C_ENEMY2, false);
  // Check no collision at spawn
  if (!e.collides(e.px, e.py)) {
    enemies.push(e);
  }
}

function endGame(won) {
  gameOverFlag = true;
  gameRunning = false;
  const go = document.getElementById('game-over');
  const text = document.getElementById('go-text');
  if (won) {
    text.textContent = '🎉 恭喜过关！\n第 ' + stage + ' 关通过！';
    text.style.color = '#0f0';
  } else {
    text.textContent = '💥 游戏结束\n得分: ' + score;
    text.style.color = '#f44';
  }
  go.style.display = 'block';
}

function checkStageClear() {
  if (enemiesLeft <= 0 && enemies.every(e => !e.alive)) {
    stage++;
    score += 500;
    initStage();
    updateUI();
    spawnEnemies();
  }
}

function spawnEnemies() {
  const count = Math.min(enemiesLeft, 4);
  for (let i = 0; i < count; i++) {
    setTimeout(() => spawnEnemy(), i * 400);
  }
}

// ========== LOOP ==========
function update() {
  if (!gameRunning) return;

  player.update();
  for (const e of enemies) e.update();
  for (const b of bullets) b.update();
  for (const p of particles) p.update();

  // Cleanup
  enemies = enemies.filter(e => e.alive || e !== e); // keep dead for a frame
  bullets = bullets.filter(b => b.alive);
  particles = particles.filter(p => p.life > 0);
  enemies = enemies.filter(e => e.alive);

  // Spawn enemies periodically
  spawnTimer++;
  if (spawnTimer >= 100 && enemiesLeft > 0 && enemies.length < 4) {
    spawnTimer = 0;
    spawnEnemy();
  }

  checkStageClear();
  updateUI();
}

function draw() {
  // Background
  ctx.fillStyle = C_BG;
  ctx.fillRect(0, 0, W, H);

  // Map
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = map[y][x];
      if (t === TILE.EMPTY) continue;
      const px = x * CELL;
      const py = y * CELL;
      if (t === TILE.BRICK) {
        ctx.fillStyle = C_WALL;
        ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        // Brick pattern
        ctx.fillStyle = '#a0522d';
        ctx.fillRect(px + 1, py + 1, CELL - 2, 2);
        ctx.fillRect(px + 1, py + CELL/2, CELL - 2, 1);
        ctx.fillRect(px + CELL/2, py + 1, 1, CELL/2 - 1);
      } else if (t === TILE.STEEL) {
        ctx.fillStyle = C_STEEL;
        ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#aaa';
        ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
        ctx.fillStyle = C_STEEL;
        ctx.fillRect(px + 3, py + 3, CELL - 6, CELL - 6);
      }
    }
  }

  // Tanks
  player.draw();
  for (const e of enemies) e.draw();

  // Bullets
  for (const b of bullets) b.draw();

  // Particles
  for (const p of particles) p.draw();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('enemies-left').textContent = enemiesLeft;
  document.getElementById('stage').textContent = stage;
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ========== INPUT ==========
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
      e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
  }
});

document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// ========== RESTART ==========
document.getElementById('restart-btn').addEventListener('click', () => {
  score = 0;
  lives = 3;
  stage = 1;
  initStage();
  updateUI();
  spawnEnemies();
  gameRunning = true;
});

// ========== START ==========
score = 0;
lives = 3;
stage = 1;
initStage();
updateUI();
spawnEnemies();
gameRunning = true;
gameLoop();
</script>
</body>
</html>
